name: UWP / Xbox build

on:
  push:
    branches: [ "uwp-compat", "port" ]
  pull_request:
    branches: [ "uwp-compat", "port" ]
  workflow_dispatch:

jobs:
  build-uwp-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-cmake

      - name: Build game as UWP-compatible DLL
        shell: msys2 {0}
        run: |
          cmake -G"Unix Makefiles" -Bbuild -DUWP_COMPAT=ON .
          cmake --build build -j$(nproc)
          echo "==== build tree (dll/exe/a) ===="
          find build -type f \( -name '*.dll' -o -name '*.exe' -o -name '*.a' -o -name '*.so' \) -print || true
          ls -la build/ || true

      - name: Stage DLL for UWP project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path uwp-deps | Out-Null

          Write-Host "Scanning build/ for libraries..."
          Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -match '\.(dll|exe|a)$' } |
            ForEach-Object { Write-Host $_.FullName }

          # Prefer shared lib produced by UWP_COMPAT (various MinGW naming styles)
          $candidates = @()
          $candidates += Get-ChildItem -Path build -Recurse -Filter "libpd*.dll" -ErrorAction SilentlyContinue
          $candidates += Get-ChildItem -Path build -Recurse -Filter "pd*.dll" -ErrorAction SilentlyContinue
          $candidates += Get-ChildItem -Path build -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue

          $dll = $candidates | Select-Object -First 1
          if (-not $dll) {
            throw "No DLL found under build/. UWP_COMPAT shared library was not produced."
          }

          Write-Host "Using DLL: $($dll.FullName)"
          Copy-Item $dll.FullName "uwp-deps/libpd.x86_64.dll" -Force

          $implib = Get-ChildItem -Path build -Recurse -Filter "*pd*.dll.a" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $implib) {
            $implib = Get-ChildItem -Path build -Recurse -Filter "*.dll.a" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($implib) {
            Write-Host "Using import lib: $($implib.FullName)"
            Copy-Item $implib.FullName "uwp-deps/libpd.x86_64.dll.a" -Force
          } else {
            Write-Host "WARNING: no import library (.dll.a) found"
          }

          Get-ChildItem uwp-deps | Format-Table Name, Length

      - name: Configure UWP project (Visual Studio generator)
        shell: pwsh
        run: |
          $pdDir = (Resolve-Path "uwp-deps").Path
          cmake -G "Visual Studio 17 2022" -A x64 -B uwp/build -S uwp -DPD_DIR="$pdDir"

      - name: Build UWP project
        shell: pwsh
        run: |
          cmake --build uwp/build --config Release -- /m /p:AppxPackageSigningEnabled=false

      - name: Collect package files
        shell: pwsh
        run: |
          $out = "artifact/pd64-uwp-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Get-ChildItem -Path uwp/build -Recurse -Include *.exe,*.dll,*.winmd,*.pri,*.appxmanifest -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $out -Force -ErrorAction SilentlyContinue }

          $searchRoots = @("uwp/build", "uwp-deps", "build")
          $names = @(
            "libpd.x86_64.dll", "pd.x86_64.dll",
            "SDL2.dll", "zlib1.dll", "z-1.dll",
            "opengl32.dll", "libgallium_wgl.dll", "libuwp.dll", "dxil.dll"
          )
          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $names -contains $_.Name } |
                ForEach-Object { Copy-Item $_.FullName $out -Force }
            }
          }

          Copy-Item uwp/Package.appxmanifest $out -Force -ErrorAction SilentlyContinue
          Copy-Item uwp/pd.ini.xboxone "$out/pd.ini" -Force -ErrorAction SilentlyContinue
          Copy-Item XBOX_ONE.md $out -Force -ErrorAction SilentlyContinue

          if (Test-Path uwp/Assets) {
            Copy-Item uwp/Assets "$out/Assets" -Recurse -Force
          }

          @"
          Perfect Dark UWP build (x64)
          ===========================

          Target: Xbox One / Series in Developer Mode

          1. Sideload via Xbox Device Portal.
          2. Set app type to Game (not App).
          3. Launch once to create LocalState.
          4. Copy ROM as pd.ntsc-final.z64 into LocalState.
          5. Copy pd.ini into LocalState (Xbox One 60 FPS profile).

          See XBOX_ONE.md for details.
          "@ | Set-Content -Path "$out/INSTALL.txt" -Encoding UTF8

          Get-ChildItem $out -Recurse | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pd64-uwp-x64
          path: artifact/pd64-uwp-x64/
          retention-days: 14

      - name: Upload build tree on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uwp-build-debug
          path: |
            build/
            uwp-deps/
            uwp/build/
          retention-days: 7
